<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&amp;family=Geist+Mono:wght@500;600&amp;display=swap" rel="stylesheet">
  <style>
    body { margin: 0; background: #0a0a0a; color: #fafafa; font-family: Geist, system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 15px; line-height: 1.4; -webkit-font-smoothing: antialiased; }
    a { color: #f2b134; text-decoration: none; } a:hover { color: #ffd070; }
    .mono { font-family: "Geist Mono", ui-monospace, SFMono-Regular, Menlo, monospace; font-variant-numeric: tabular-nums; }
    .num { font-variant-numeric: tabular-nums; }
    svg { display: block; }
  </style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; overflow: hidden; background: #0a0a0a; box-sizing: border-box;">

  
  <header style="position: relative; display: flex; align-items: center; justify-content: space-between; height: 56px; padding: 0 16px 0 12px; box-sizing: border-box; background: #171717; border-bottom: 1px solid rgba(255,255,255,0.10);">
    <div style="display: flex; align-items: center; gap: 10px;">
      <div style="color: #a3a3a3;"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg></div>
      <div style="display: flex; flex-direction: column;">
        <div style="font-size: 15px; font-weight: 700;">Push A</div>
        <div class="num" style="font-size: 12px; color: #737373;">6:12 elapsed</div>
      </div>
    </div>
    <div style="display: flex; align-items: center; gap: 8px;">
      <div class="num" style="display: flex; align-items: center; gap: 6px; height: 36px; padding: 0 12px; border-radius: 999px; background: #262626; color: #a3a3a3; font-size: 15px; font-weight: 700;"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 2.5M9 2h6"/></svg>—</div>
      <div style="font-size: 14px; font-weight: 600; color: #a3a3a3;">Wrap up</div>
    </div>
    
  </header>
  
  <div style="display: flex; align-items: center; gap: 12px; height: 44px; padding: 0 16px; box-sizing: border-box;">
    <div class="num" style="font-size: 13px; font-weight: 600; color: #a3a3a3; white-space: nowrap;">2 of 6</div>
    <div style="display: flex; gap: 4px; flex-grow: 1;"><div style="flex-grow: 1; height: 4px; border-radius: 999px; background: #f2b134; "></div><div style="flex-grow: 1; height: 4px; border-radius: 999px; background: rgba(242,177,52,0.14); box-shadow: inset 0 0 0 1px #f2b134;"></div><div style="flex-grow: 1; height: 4px; border-radius: 999px; background: #333333; "></div><div style="flex-grow: 1; height: 4px; border-radius: 999px; background: #333333; "></div><div style="flex-grow: 1; height: 4px; border-radius: 999px; background: #333333; "></div><div style="flex-grow: 1; height: 4px; border-radius: 999px; background: #333333; "></div></div>
    <div style="display: flex; align-items: center; gap: 5px; height: 44px; padding: 0 4px; font-size: 13px; font-weight: 600; color: #a3a3a3;"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h10"/></svg>Lineup</div>
  </div>
  <div style="display: flex; flex-direction: column; gap: 12px; padding: 0 12px; box-sizing: border-box;">
    <div style="display: flex; flex-direction: column; gap: 14px; padding: 16px; border-radius: 16px; background: #171717; border: 1px solid rgba(255,255,255,0.10);">
      <div style="display: flex; align-items: baseline; justify-content: space-between; gap: 12px;">
        <div style="font-size: 17px; font-weight: 700; letter-spacing: -0.01em;">Machine Chest-Supported Row</div>
        <div class="num" style="font-size: 13px; color: #737373; white-space: nowrap;">10–12 × 2</div>
      </div><div class="num" style="font-size: 24px; font-weight: 700; letter-spacing: -0.02em; line-height: 1.15;">First time — pick a weight you can do 12 with 4 left</div></div>
  </div>
  
  <div style="position: absolute; inset: 0; background: rgba(0,0,0,0.55);"></div>
  <div style="position: absolute; left: 0; right: 0; bottom: 0; display: flex; flex-direction: column; gap: 14px; padding: 6px 20px 42px; box-sizing: border-box; background: #171717; border-top: 1px solid rgba(255,255,255,0.10); border-radius: 24px 24px 0 0;">
    <div style="display: flex; justify-content: center; padding: 6px 0 2px;"><div style="width: 36px; height: 4px; border-radius: 999px; background: #333333;"></div></div>
    
    <div style="display: flex; flex-direction: column; gap: 2px;">
      <div style="font-size: 12px; font-weight: 600; letter-spacing: 0.04em; color: #737373;">MACHINE CHEST-SUPPORTED ROW</div>
      <div style="font-size: 17px; font-weight: 700;">Weight for set 1</div>
    </div>
    <div class="num" style="display: flex; align-items: baseline; justify-content: center; gap: 8px; height: 72px; border-radius: 16px; background: #0a0a0a; border: 1px solid rgba(255,255,255,0.10);">
      <span style="font-size: 44px; font-weight: 700; letter-spacing: -0.03em;">35</span><span style="font-size: 17px; color: #a3a3a3;">kg</span>
    </div>
    <div style="display: flex; gap: 8px; justify-content: center;"><div class="num" style="display: flex; align-items: center; justify-content: center; height: 40px; padding: 0 14px; border-radius: 10px; background: #262626; border: 1px solid rgba(255,255,255,0.10); color: #fafafa; font-size: 14px; font-weight: 600; white-space: nowrap;">− 2.5</div><div class="num" style="display: flex; align-items: center; justify-content: center; height: 40px; padding: 0 14px; border-radius: 10px; background: rgba(242,177,52,0.14); border: 1px solid #f2b134; color: #f2b134; font-size: 14px; font-weight: 600; white-space: nowrap;">last 32.5</div><div class="num" style="display: flex; align-items: center; justify-content: center; height: 40px; padding: 0 14px; border-radius: 10px; background: #262626; border: 1px solid rgba(255,255,255,0.10); color: #fafafa; font-size: 14px; font-weight: 600; white-space: nowrap;">+ 2.5</div></div>
    <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px;">
      <div class="num" style="display: flex; align-items: center; justify-content: center; height: 52px; border-radius: 12px; background: #262626; color: #fafafa; font-size: 24px; font-weight: 600;">1</div><div class="num" style="display: flex; align-items: center; justify-content: center; height: 52px; border-radius: 12px; background: #262626; color: #fafafa; font-size: 24px; font-weight: 600;">2</div><div class="num" style="display: flex; align-items: center; justify-content: center; height: 52px; border-radius: 12px; background: #262626; color: #fafafa; font-size: 24px; font-weight: 600;">3</div><div class="num" style="display: flex; align-items: center; justify-content: center; height: 52px; border-radius: 12px; background: #262626; color: #fafafa; font-size: 24px; font-weight: 600;">4</div><div class="num" style="display: flex; align-items: center; justify-content: center; height: 52px; border-radius: 12px; background: #262626; color: #fafafa; font-size: 24px; font-weight: 600;">5</div><div class="num" style="display: flex; align-items: center; justify-content: center; height: 52px; border-radius: 12px; background: #262626; color: #fafafa; font-size: 24px; font-weight: 600;">6</div><div class="num" style="display: flex; align-items: center; justify-content: center; height: 52px; border-radius: 12px; background: #262626; color: #fafafa; font-size: 24px; font-weight: 600;">7</div><div class="num" style="display: flex; align-items: center; justify-content: center; height: 52px; border-radius: 12px; background: #262626; color: #fafafa; font-size: 24px; font-weight: 600;">8</div><div class="num" style="display: flex; align-items: center; justify-content: center; height: 52px; border-radius: 12px; background: #262626; color: #fafafa; font-size: 24px; font-weight: 600;">9</div>
      <div class="num" style="display: flex; align-items: center; justify-content: center; height: 52px; border-radius: 12px; background: #171717; color: #a3a3a3; font-size: 24px; font-weight: 600;">.</div><div class="num" style="display: flex; align-items: center; justify-content: center; height: 52px; border-radius: 12px; background: #262626; color: #fafafa; font-size: 24px; font-weight: 600;">0</div><div class="num" style="display: flex; align-items: center; justify-content: center; height: 52px; border-radius: 12px; background: #171717; color: #a3a3a3; font-size: 24px; font-weight: 600;"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 6H8l-5 6 5 6h13a1 1 0 0 0 1-1V7a1 1 0 0 0-1-1z"/><path d="M18 9l-6 6M12 9l6 6"/></svg></div>
    </div>
    <button style="width: 100%; height: 56px; border: 0; border-radius: 14px; background: #f2b134; color: #1a1200; font: inherit; font-size: 17px; font-weight: 700; letter-spacing: -0.01em; ">Set 35 kg</button>
    <div style="text-align: center; font-size: 13px; color: #737373;">Wrong unit? <span style="color: #a3a3a3; font-weight: 600;">Exercise settings</span></div>
  </div>
</div>
</x-dc>
</body>
</html>

<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&amp;family=Geist+Mono:wght@500;600&amp;display=swap" rel="stylesheet">
  <style>
    body { margin: 0; background: #0a0a0a; color: #fafafa; font-family: Geist, system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 15px; line-height: 1.4; -webkit-font-smoothing: antialiased; }
    a { color: #f2b134; text-decoration: none; } a:hover { color: #ffd070; }
    .mono { font-family: "Geist Mono", ui-monospace, SFMono-Regular, Menlo, monospace; font-variant-numeric: tabular-nums; }
    .num { font-variant-numeric: tabular-nums; }
    svg { display: block; }
  </style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; overflow: hidden; background: #0a0a0a; box-sizing: border-box;">

  
  <header style="position: relative; display: flex; align-items: center; justify-content: space-between; height: 56px; padding: 0 16px 0 12px; box-sizing: border-box; background: #171717; border-bottom: 1px solid rgba(255,255,255,0.10);">
    <div style="display: flex; align-items: center; gap: 10px;">
      <div style="color: #a3a3a3;"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg></div>
      <div style="display: flex; flex-direction: column;">
        <div style="font-size: 15px; font-weight: 700;">Push A</div>
        <div class="num" style="font-size: 12px; color: #737373;">6:12 elapsed</div>
      </div>
    </div>
    <div style="display: flex; align-items: center; gap: 8px;">
      <div class="num" style="display: flex; align-items: center; gap: 6px; height: 36px; padding: 0 12px; border-radius: 999px; background: #f2b134; color: #1a1200; font-size: 15px; font-weight: 700;"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 2.5M9 2h6"/></svg>1:28</div>
      <div style="font-size: 14px; font-weight: 600; color: #a3a3a3;">Wrap up</div>
    </div>
    <div style="position: absolute; left: 0; bottom: -1px; height: 2px; width: 8%; background: #f2b134;"></div>
  </header>
  
  <div style="display: flex; align-items: center; gap: 12px; height: 44px; padding: 0 16px; box-sizing: border-box;">
    <div class="num" style="font-size: 13px; font-weight: 600; color: #a3a3a3; white-space: nowrap;">2 of 6</div>
    <div style="display: flex; gap: 4px; flex-grow: 1;"><div style="flex-grow: 1; height: 4px; border-radius: 999px; background: #f2b134; "></div><div style="flex-grow: 1; height: 4px; border-radius: 999px; background: rgba(242,177,52,0.14); box-shadow: inset 0 0 0 1px #f2b134;"></div><div style="flex-grow: 1; height: 4px; border-radius: 999px; background: #333333; "></div><div style="flex-grow: 1; height: 4px; border-radius: 999px; background: #333333; "></div><div style="flex-grow: 1; height: 4px; border-radius: 999px; background: #333333; "></div><div style="flex-grow: 1; height: 4px; border-radius: 999px; background: #333333; "></div></div>
    <div style="display: flex; align-items: center; gap: 5px; height: 44px; padding: 0 4px; font-size: 13px; font-weight: 600; color: #a3a3a3;"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h10"/></svg>Lineup</div>
  </div>
  <div style="display: flex; flex-direction: column; gap: 12px; padding: 0 12px; box-sizing: border-box;">
    <div style="display: flex; flex-direction: column; gap: 14px; padding: 16px; border-radius: 16px; background: #171717; border: 1px solid rgba(255,255,255,0.10);">
      
      <div style="display: flex; align-items: baseline; justify-content: space-between; gap: 12px;">
        <div style="font-size: 17px; font-weight: 700; letter-spacing: -0.01em;">Machine Chest-Supported Row</div>
        <div class="num" style="font-size: 13px; color: #737373; white-space: nowrap;">10–12 × 2</div>
      </div>
      <div class="num" style="font-size: 24px; font-weight: 700; letter-spacing: -0.02em; line-height: 1.15;">First time — pick a weight you can do 12 with 4 left</div>
      <div style="display: flex; flex-direction: column; gap: 10px;">
        
      <div style="display: flex; align-items: center; gap: 10px; height: 44px; padding: 0 12px; border-radius: 12px; background: rgba(95,211,138,0.14); border: 1px solid rgba(95,211,138,0.35);">
        <div style="width: 44px; color: #737373; font-size: 13px; font-weight: 500;">Set 1</div>
        <div class="num" style="font-size: 17px; font-weight: 600;">35 kg × 12</div>
        <div style="color: #5fd38a;"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M6 11l6-6 6 6"/></svg></div>
        <div style="flex-grow: 1;"></div>
        <div style="color: #5fd38a; font-size: 13px; font-weight: 600;">logged</div>
      </div>
        
      <div style="display: flex; align-items: center; gap: 10px;">
        <div style="width: 44px; color: #737373; font-size: 13px; font-weight: 500;">Set 2</div>
        <div class="num" style="display: flex; align-items: center; justify-content: center; width: 118px; height: 52px; border-radius: 14px; background: #262626; border: 1px solid rgba(255,255,255,0.10); font-size: 22px; font-weight: 600; letter-spacing: -0.01em; ">35 kg</div><div class="num" style="display: flex; align-items: center; justify-content: center; width: 76px; height: 52px; border-radius: 14px; background: #262626; border: 1px solid rgba(255,255,255,0.10); font-size: 22px; font-weight: 600; letter-spacing: -0.01em; ">12</div>
        <div style="flex-grow: 1;"></div>
        <div style="display: flex; align-items: center; justify-content: center; width: 60px; height: 52px; border-radius: 14px; background: #f2b134; color: #1a1200;"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7"/></svg></div>
      </div>
      </div>
      <div style="font-size: 12px; color: #737373;">last set · tap a logged set to change or remove it</div>
      <div style="display: flex; align-items: center; justify-content: space-between; padding-top: 4px; font-size: 14px; font-weight: 500; color: #a3a3a3;"><span style="display: flex; align-items: center; gap: 6px;">postpone <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12h12M11 7l5 5-5 5M20 6v12"/></svg></span><div style="display: flex; align-items: center; justify-content: center; width: 44px; height: 36px; border-radius: 10px; background: #262626; color: #a3a3a3;"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M5 12h.01M12 12h.01M19 12h.01"/></svg></div></div></div>
    
    <div style="display: flex; align-items: center; justify-content: space-between; padding: 2px 16px 0; font-size: 13px; color: #737373;">
      <div style="display: flex; align-items: center; gap: 6px; min-width: 0;"><span style="white-space: nowrap;">Up next ·</span><span style="color: #a3a3a3; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">Lat Pulldown (Front, Medium Grip)</span></div>
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>
    </div>
  </div>
</div>
</x-dc>
</body>
</html>
